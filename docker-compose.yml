services:
    mysql:
        image: mysql:8.4
        container_name: e-book-mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-e_book_api}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password1@2#}
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1",
                ]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 15s
        networks:
            e-book-net:
                aliases:
                    - mysql

    e-book-api:
        build:
            context: ./e-book-api
            dockerfile: Dockerfile
        container_name: e-book-api
        restart: unless-stopped
        env_file:
            - ./e-book-api/.env
        environment:
            - APP_ENV=${APP_ENV:-production}
            - APP_DEBUG=${APP_DEBUG:-false}
            - APP_URL=${APP_URL:-https://e-book-api.nayhtetkhant.com}
            - FRONTEND_URL=${FRONTEND_URL:-https://e-book.nayhtetkhant.com}
            - DB_CONNECTION=mysql
            - DB_HOST=mysql
            - DB_PORT=3306
            - DB_DATABASE=${DB_DATABASE:-e_book_api}
            - DB_USERNAME=${DB_USERNAME:-root}
            - DB_PASSWORD=${DB_PASSWORD:-password1@2#}
            - SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS:-e-book-fe.tintaungkhant.com,e-book-be.tintaungkhant.com,e-book.nayhtetkhant.com,e-book-api.nayhtetkhant.com}
        volumes:
            - ./e-book-api/storage:/var/www/storage
            - ./e-book-api/bootstrap/cache:/var/www/bootstrap/cache
        expose:
            - "9000"
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            e-book-net:
                aliases:
                    - e-book-api

    e-book-web:
        build:
            context: ./e-book-web
            dockerfile: Dockerfile
            args:
                - API_BASE_URL=${API_BASE_URL:-https://e-book.nayhtetkhant.com}
        container_name: e-book-web
        restart: unless-stopped
        env_file:
            - ./e-book-web/.env
        environment:
            - NODE_ENV=production
            - PORT=3000
            - HOSTNAME=0.0.0.0
            - API_BASE_URL=${API_BASE_URL:-https://e-book-api.nayhtetkhant.com}
        expose:
            - "3000"
        depends_on:
            - e-book-api
        networks:
            e-book-net:
                aliases:
                    - e-book-web

    nginx:
        build:
            context: ./nginx
            dockerfile: Dockerfile
        container_name: e-book-nginx
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./nginx/conf.d:/etc/nginx/conf.d:ro
            - ./e-book-api/public:/var/www/public:ro
            - ./certbot/conf:/etc/letsencrypt
            - ./certbot/www:/var/www/certbot
        depends_on:
            - e-book-api
            - e-book-web
        networks:
            e-book-net:
                aliases:
                    - nginx

    certbot:
        image: certbot/certbot:latest
        container_name: e-book-certbot
        restart: unless-stopped
        volumes:
            - ./certbot/conf:/etc/letsencrypt
            - ./certbot/www:/var/www/certbot
        entrypoint: >
            /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;"
        depends_on:
            - nginx
        networks:
            - e-book-net

networks:
    e-book-net:
        driver: bridge

volumes:
    mysql_data:
